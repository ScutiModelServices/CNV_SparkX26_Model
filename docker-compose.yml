# Spark service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9180)
# Scale:  SPARK_REPLICAS=3 docker compose up -d --build, then: docker compose restart cnv_sparkx26_model_lb

name: cnv_sparkx26_model

services:
  cnv_sparkx26_model:
    build: .
    image: cnv_sparkx26_model:latest
    restart: unless-stopped
    mem_limit: ${SPARK_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SPARK_ADMIN_PASSWORD: ${SPARK_ADMIN_PASSWORD:-}
      SPARK_NUM_THREAD: ${SPARK_NUM_THREAD:-}
      SPARK_REPLICAS: ${SPARK_REPLICAS:-1}  # shown read-only on /admin/
      SPARK_OLLAMA_URL: ${SPARK_OLLAMA_URL:-}  # set = answer through this Ollama (GGUF) instead of torch
      SPARK_OLLAMA_MODEL: ${SPARK_OLLAMA_MODEL:-}
      SPARK_THINKING: ${SPARK_THINKING:-}  # off (default) or on, Ollama backend
      SPARK_HIDE_REASONING: ${SPARK_HIDE_REASONING:-}  # empty = on
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    volumes:
      - cnv_sparkx26_model_models:/models
      - cnv_sparkx26_model_data:/data
    deploy:
      replicas: ${SPARK_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9180/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [cnv_sparkx26_model]

  cnv_sparkx26_model_lb:
    container_name: cnv_sparkx26_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SPARK_PORT:-9180}:9180"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cnv_sparkx26_model:
        condition: service_healthy
    networks:
      cnv_sparkx26_model:
      citadel:
        aliases: [cnv_sparkx26_model_lb]

volumes:
  cnv_sparkx26_model_models:
    name: cnv_sparkx26_model_models
  cnv_sparkx26_model_data:
    name: cnv_sparkx26_model_data
networks:
  # Other stacks reach http://cnv_sparkx26_model_lb:9180 by joining this network.
  cnv_sparkx26_model:
    name: cnv_sparkx26_model
  citadel:
    name: citadel_core
    external: true
