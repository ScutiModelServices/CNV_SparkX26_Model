# Load balancer in front of the cnv_sparkx26_model replicas. Docker DNS gives `cnv_sparkx26_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream cnv_sparkx26_model {
    least_conn;
    server cnv_sparkx26_model:29203 max_fails=2 fail_timeout=10s;
}

server {
    listen 29203;
    client_max_body_size 2m;

    location / {
        proxy_pass http://cnv_sparkx26_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 130s;
        # A chat is a pure function of its body, so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
